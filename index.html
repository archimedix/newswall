<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Newswall — the whole world, all at once</title>
<meta name="description" content="Watch several live news channels on the same screen. No account, no data collected.">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="styles.css">
<link rel="preload" href="assets/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2305070a'/><g fill='%23e9eef4'><rect x='5' y='7' width='9' height='7' rx='1.5'/><rect x='17' y='7' width='10' height='7' rx='1.5'/><rect x='5' y='17' width='10' height='7' rx='1.5'/></g><rect x='18' y='17' width='9' height='7' rx='1.5' fill='%23ff4b2b'/></svg>">
<!-- hls.js and the fonts live in the repo: no third-party calls to render the page. -->
<script src="assets/vendor/hls.min.js"></script>
</head>
<body>

<header id="bar" class="glass">
  <button id="logo" title="Newswall — open the sources (S)">
    <svg viewBox="0 0 32 32" width="16" height="16" aria-hidden="true">
      <g fill="currentColor">
        <rect x="4" y="6" width="10" height="8" rx="1.5"/><rect x="17" y="6" width="11" height="8" rx="1.5"/>
        <rect x="4" y="17" width="11" height="8" rx="1.5"/>
      </g>
      <rect x="18" y="17" width="10" height="8" rx="1.5" fill="var(--tally)"/>
    </svg>
    <span>NEWSWALL</span>
  </button>

  <!-- Which of the two views this is: the switch says it, and leads to the other. -->
  <nav id="views" aria-label="View">
    <a class="on" aria-current="page" href="index.html" title="The wall: up to 12 channels side by side">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><g fill="currentColor"><rect x="1.5" y="3" width="6" height="4.5" rx="1"/><rect x="8.5" y="3" width="6" height="4.5" rx="1"/><rect x="1.5" y="8.5" width="6" height="4.5" rx="1"/><rect x="8.5" y="8.5" width="6" height="4.5" rx="1"/></g></svg>
      <span>Wall</span>
    </a>
    <a id="to-globe" href="globe.html" title="The globe: explore the channels country by country (G)">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c-2.6 3.2-2.6 9.2 0 12.4M8 1.8c2.6 3.2 2.6 9.2 0 12.4"/></g></svg>
      <span>Globe</span>
    </a>
  </nav>

  <!-- The control room's red tally light: it always shows who is talking. -->
  <div id="onair" hidden><span class="dot"></span><span class="who"></span></div>

  <div class="spacer"></div>

  <div id="live-count" class="meta"></div>

  <nav id="controls">
    <button data-act="palette" class="ghost" title="Search and add a channel (⌘K)">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2 14 14" stroke-linecap="round"/></g></svg>
      <span>Search</span><kbd class="k">⌘K</kbd>
    </button>
    <button data-act="sources" title="Browse the catalog and pick the categories (S)">Sources<b id="sources-filter" class="fbadge" hidden></b></button>
    <button data-act="mute-all" title="Mute everything (M)">Mute</button>
    <button data-act="fullscreen" title="Full screen (F)">Full screen</button>
    <button data-act="keys" class="icon" title="Shortcuts (?)">?</button>
  </nav>
</header>

<main id="grid" aria-label="Wall of live streams"></main>

<aside id="panel" class="glass" hidden>
  <div class="panel-head">
    <strong>Catalog</strong>
    <span class="meta" id="panel-count"></span>
    <button id="panel-close" class="icon" title="Close (Esc)">✕</button>
  </div>

  <!-- What the catalog shows: shared with the globe. -->
  <div id="panel-cats"></div>

  <div class="panel-find">
    <input id="panel-search" type="search" placeholder="Search channel, country or language…"
           autocomplete="off" spellcheck="false">
    <select id="panel-country" aria-label="Filter by country"></select>
    <select id="panel-lang" aria-label="Filter by language"></select>
  </div>

  <div id="panel-filters"></div>
  <div id="panel-list"></div>

  <div class="panel-foot">
    <button id="share">Copy the link to this wall</button>
    <span class="meta" id="share-msg"></span>
  </div>
</aside>

<!-- Quick search: the fastest way to add or remove a channel. -->
<div id="palette" hidden>
  <div class="pal glass">
    <div class="pal-in">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2 14 14" stroke-linecap="round"/></g></svg>
      <input id="pal-q" type="text" placeholder="Channel, country, language…"
             autocomplete="off" spellcheck="false">
      <span class="meta" id="pal-count"></span>
    </div>
    <div id="pal-list"></div>
    <div class="pal-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
      <span><kbd>↵</kbd> add or remove</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>

<div id="keys" hidden>
  <div class="keys-card glass">
    <div class="keys-head"><strong>Shortcuts</strong><button id="keys-close" class="icon">✕</button></div>
    <dl>
      <dt><kbd>click</kbd></dt><dd>gives the tile the audio</dd>
      <dt><kbd>double click</kbd></dt><dd>enlarges</dd>
      <dt><kbd>1</kbd>–<kbd>9</kbd></dt><dd>quick audio</dd>
      <dt><kbd>⌘K</kbd> <kbd>/</kbd></dt><dd>search and add</dd>
      <dt><kbd>S</kbd></dt><dd>catalog</dd>
      <dt><kbd>M</kbd></dt><dd>mute everything</dd>
      <dt><kbd>F</kbd></dt><dd>full screen</dd>
      <dt><kbd>G</kbd></dt><dd>the globe</dd>
      <dt><kbd>Esc</kbd></dt><dd>back to the grid</dd>
      <dt><kbd>drag</kbd></dt><dd>reorder the tiles</dd>
    </dl>
  </div>
</div>

<div id="toast" aria-live="polite"></div>

<script type="module" src="js/wall/wall.js"></script>
</body>
</html>
