name: refresh live sources

# The catalog maintains itself: HLS streams die without notice and come back.
# No server, just this Action.
on:
  schedule:
    - cron: '17 * * * *'      # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/refresh-live.py
      - name: commit if changed
        run: |
          git config user.name  "newswall-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live.json
          git diff --staged --quiet || git commit -m "refresh: source status $(date -u +%F\ %H:%M)"
          git push
